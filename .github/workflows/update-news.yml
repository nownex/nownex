name: Update NOWNEX News

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-news:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1 — تحميل المشروع
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2 — إعداد Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # 3 — تثبيت المكتبات
      # ==========================================

      - name: Install dependencies
        run: |
          pip install feedparser requests


      # ==========================================
      # 4 — جلب الأخبار + تلخيصها بالعربية
      # ==========================================

      - name: Generate Arabic NOWNEX News
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          cat > generate_news.py <<'PYTHON'

          import os
          import json
          import time
          import re
          import html
          import requests
          import feedparser
          from datetime import datetime, timezone


          # =====================================================
          # إعدادات
          # =====================================================

          GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY")

          OUTPUT_FILE = "news.json"

          MAX_NEWS = 8


          # =====================================================
          # مصادر الأخبار
          # =====================================================

          FEEDS = [

              {
                  "name": "BBC",
                  "category": "World",
                  "url": "https://feeds.bbci.co.uk/news/world/rss.xml"
              },

              {
                  "name": "BBC",
                  "category": "Technology",
                  "url": "https://feeds.bbci.co.uk/news/technology/rss.xml"
              },

              {
                  "name": "BBC",
                  "category": "Entertainment",
                  "url": "https://feeds.bbci.co.uk/news/entertainment_and_arts/rss.xml"
              },

              {
                  "name": "BBC",
                  "category": "Science",
                  "url": "https://feeds.bbci.co.uk/news/science_and_environment/rss.xml"
              },

              {
                  "name": "BBC",
                  "category": "Sports",
                  "url": "https://feeds.bbci.co.uk/sport/rss.xml"
              }

          ]


          # =====================================================
          # تنظيف النص
          # =====================================================

          def clean_text(text):

              if not text:
                  return ""

              text = html.unescape(text)

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          # =====================================================
          # جلب الأخبار
          # =====================================================

          articles = []

          seen_links = set()

          for feed_info in FEEDS:

              try:

                  feed = feedparser.parse(
                      feed_info["url"]
                  )

                  for entry in feed.entries[:10]:

                      title = clean_text(
                          entry.get(
                              "title",
                              ""
                          )
                      )

                      description = clean_text(
                          entry.get(
                              "summary",
                              entry.get(
                                  "description",
                                  ""
                              )
                          )
                      )

                      link = entry.get(
                          "link",
                          ""
                      )

                      if not title or not link:
                          continue

                      if link in seen_links:
                          continue

                      seen_links.add(link)

                      articles.append({

                          "original_title": title,

                          "description": description,

                          "link": link,

                          "source": feed_info["name"],

                          "category": feed_info["category"]

                      })

              except Exception as error:

                  print(
                      "Feed error:",
                      feed_info["url"],
                      error
                  )


          # =====================================================
          # إزالة الأخبار الزائدة
          # =====================================================

          articles = articles[:MAX_NEWS]


          # =====================================================
          # Gemini
          # =====================================================

          def summarize_with_gemini(article):

              if not GEMINI_API_KEY:

                  print(
                      "GEMINI_API_KEY غير موجود."
                  )

                  return {

                      "title": article["original_title"],

                      "summary": (
                          "لم يتم إنشاء الملخص العربي "
                          "لأن مفتاح الذكاء الاصطناعي غير موجود."
                      )

                  }


              prompt = f"""
أنت محرر الأخبار الرسمي لمنصة عربية اسمها NOWNEX.

مهمتك تحويل الخبر التالي إلى محتوى عربي أصلي ومختصر.

العنوان الأصلي:
{article["original_title"]}

وصف الخبر:
{article["description"]}

القواعد:

1. اكتب عنواناً عربياً واضحاً ومختصراً.
2. إذا كان هناك اسم شخص أو شركة أو منظمة معروفة، حافظ على الاسم الصحيح.
3. لا تضف أي معلومة غير موجودة في الخبر.
4. لا تخترع أرقاماً أو تصريحات.
5. اكتب ملخصاً عربياً من 2 إلى 4 جمل.
6. الملخص يجب أن يشرح للقارئ:
   - ماذا حدث؟
   - من الأطراف المعنية؟
   - لماذا الخبر مهم؟
7. لا تنسخ النص الأصلي حرفياً.
8. استخدم لغة عربية صحفية حديثة وسهلة.
9. لا تستخدم مقدمات مثل "في هذا الخبر".
10. لا تذكر أنك ذكاء اصطناعي.
11. لا تضع روابط داخل الملخص.

أعد النتيجة بصيغة JSON فقط:

{{
  "title": "العنوان العربي",
  "summary": "الملخص العربي"
}}
"""


              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/gemini-2.5-flash:generateContent"
              )


              payload = {

                  "contents": [

                      {

                          "parts": [

                              {
                                  "text": prompt
                              }

                          ]

                      }

                  ],

                  "generationConfig": {

                      "temperature": 0.2,

                      "responseMimeType": "application/json"

                  }

              }


              headers = {

                  "Content-Type":
                      "application/json",

                  "x-goog-api-key":
                      GEMINI_API_KEY

              }


              try:

                  response = requests.post(

                      url,

                      headers=headers,

                      json=payload,

                      timeout=60

                  )


                  if response.status_code != 200:

                      print(
                          "Gemini error:",
                          response.status_code,
                          response.text
                      )

                      return {

                          "title":
                              article["original_title"],

                          "summary":
                              article["description"]

                      }


                  data = response.json()


                  text = (
                      data
                      .get("candidates", [{}])[0]
                      .get("content", {})
                      .get("parts", [{}])[0]
                      .get("text", "")
                  )


                  text = text.strip()


                  # إزالة markdown إذا ظهر
                  text = re.sub(
                      r"^```json",
                      "",
                      text,
                      flags=re.IGNORECASE
                  )

                  text = re.sub(
                      r"```$",
                      "",
                      text
                  )

                  text = text.strip()


                  result = json.loads(text)


                  return {

                      "title":
                          clean_text(
                              result.get(
                                  "title",
                                  article["original_title"]
                              )
                          ),

                      "summary":
                          clean_text(
                              result.get(
                                  "summary",
                                  article["description"]
                              )
                          )

                  }


              except Exception as error:

                  print(
                      "Gemini processing error:",
                      error
                  )

                  return {

                      "title":
                          article["original_title"],

                      "summary":
                          article["description"]

                  }


          # =====================================================
          # معالجة الأخبار
          # =====================================================

          final_news = []


          for article in articles:

              print(
                  "Processing:",
                  article["original_title"]
              )


              ai_result = summarize_with_gemini(
                  article
              )


              final_news.append({

                  "title":
                      ai_result["title"],

                  "summary":
                      ai_result["summary"],

                  "category":
                      article["category"],

                  "source":
                      article["source"],

                  "link":
                      article["link"],

                  "published":
                      datetime.now(
                          timezone.utc
                      ).isoformat()

              })


              # حتى لا نرسل الطلبات بسرعة كبيرة
              time.sleep(2)


          # =====================================================
          # حفظ الأخبار
          # =====================================================

          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "news":
                  final_news

          }


          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "تم إنشاء",
              len(final_news),
              "أخبار."
          )

          PYTHON


          python generate_news.py


      # ==========================================
      # 5 — حفظ news.json في GitHub
      # ==========================================

      - name: Commit news.json
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then

            echo "لا توجد تغييرات."

          else

            git commit \
              -m "Update NOWNEX Arabic news"

            git push

          fi
