name: Update NOWNEX News

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:

      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Generate Arabic NOWNEX News
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > generate_news.py <<'PY'
          import os
          import json
          import re
          import html
          import requests
          import feedparser
          from datetime import datetime, timezone

          API_KEY = os.environ.get("GEMINI_API_KEY")

          if not API_KEY:
              raise RuntimeError("GEMINI_API_KEY is missing")

          GEMINI_URL = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-2.5-flash:generateContent"
          )

          RSS_FEEDS = [
              (
                  "BBC عربي",
                  "https://feeds.bbci.co.uk/arabic/rss.xml"
              ),
              (
                  "الجزيرة",
                  "https://www.aljazeera.net/aljazeera.rss"
              )
          ]

          MAX_NEWS = 8

          def clean_text(value):
              value = html.unescape(str(value or ""))
              value = re.sub(r"<[^>]+>", " ", value)
              value = re.sub(r"\s+", " ", value)
              return value.strip()

          def translate_category(category):
              category = str(category or "").lower()

              if any(x in category for x in ["sport", "football"]):
                  return "Sports"

              if any(x in category for x in ["tech", "technology"]):
                  return "Technology"

              if any(x in category for x in ["science"]):
                  return "Science"

              if any(x in category for x in ["business", "economy"]):
                  return "World"

              return "World"

          def ask_gemini(title, description, source):
              prompt = f"""
          أنت محرر أخبار محترف يعمل لمنصة عربية اسمها NOWNEX.

          مهمتك تحويل الخبر التالي إلى مادة عربية قصيرة وواضحة
          بأسلوب صحفي احترافي.

          المصدر:
          {source}

          العنوان الأصلي:
          {title}

          وصف الخبر:
          {description}

          أعد النتيجة بصيغة JSON فقط، بدون Markdown وبدون أي نص إضافي.

          الصيغة المطلوبة:

          {{
            "title": "عنوان عربي جذاب ودقيق",
            "summary": "ملخص عربي من 2 إلى 4 جمل يشرح أهم ما حدث",
            "category": "World أو Technology أو Entertainment أو AI أو Cars أو Science أو Sports أو Facts"
          }}

          القواعد:
          - اكتب باللغة العربية الفصحى.
          - لا تترجم ترجمة حرفية.
          - لا تضف معلومات غير موجودة في المادة الأصلية.
          - لا تخترع أسماء أو أرقامًا أو تصريحات.
          - حافظ على المعنى الأصلي بدقة.
          - لا تستخدم عبارات مبالغًا فيها.
          - اجعل العنوان مناسبًا لموقع إخباري محترف.
          """

              response = requests.post(
                  GEMINI_URL,
                  params={"key": API_KEY},
                  headers={
                      "Content-Type": "application/json"
                  },
                  json={
                      "contents": [
                          {
                              "parts": [
                                  {
                                      "text": prompt
                                  }
                              ]
                          }
                      ]
                  },
                  timeout=90
              )

              if response.status_code != 200:
                  print("Gemini error:", response.status_code)
                  print(response.text[:2000])
                  raise RuntimeError("Gemini API request failed")

              data = response.json()

              try:
                  text = data["candidates"][0]["content"]["parts"][0]["text"]
              except Exception:
                  raise RuntimeError(
                      "Could not read Gemini response"
                  )

              text = text.strip()

              text = re.sub(
                  r"^```json\s*",
                  "",
                  text,
                  flags=re.IGNORECASE
              )

              text = re.sub(
                  r"\s*```$",
                  "",
                  text
              )

              result = json.loads(text)

              return {
                  "title": clean_text(result.get("title")),
                  "summary": clean_text(result.get("summary")),
                  "category": result.get(
                      "category",
                      "World"
                  )
              }

          def get_feed_items():
              articles = []

              for source_name, feed_url in RSS_FEEDS:

                  try:
                      print("Reading:", source_name)

                      feed = feedparser.parse(feed_url)

                      for entry in feed.entries[:10]:

                          title = clean_text(
                              entry.get("title", "")
                          )

                          description = clean_text(
                              entry.get(
                                  "summary",
                                  entry.get(
                                      "description",
                                      ""
                                  )
                              )
                          )

                          link = entry.get("link", "")

                          if not title or not link:
                              continue

                          articles.append(
                              {
                                  "title": title,
                                  "description": description,
                                  "link": link,
                                  "source": source_name
                              }
                          )

                  except Exception as error:
                      print(
                          "Feed error:",
                          source_name,
                          error
                      )

              return articles

          def remove_duplicates(items):
              result = []
              seen = set()

              for item in items:

                  key = re.sub(
                      r"\W+",
                      "",
                      item["title"].lower()
                  )

                  if key in seen:
                      continue

                  seen.add(key)
                  result.append(item)

              return result

          articles = get_feed_items()

          articles = remove_duplicates(articles)

          if not articles:
              raise RuntimeError(
                  "No news articles were found"
              )

          articles = articles[:MAX_NEWS]

          final_news = []

          for index, article in enumerate(articles):

              print(
                  f"Processing {index + 1}/{len(articles)}:"
                  f" {article['title']}"
              )

              try:

                  ai = ask_gemini(
                      article["title"],
                      article["description"],
                      article["source"]
                  )

                  final_news.append(
                      {
                          "title": ai["title"],
                          "summary": ai["summary"],
                          "description": ai["summary"],
                          "category": ai["category"],
                          "source": article["source"],
                          "link": article["link"],
                          "publishedAt": datetime.now(
                              timezone.utc
                          ).isoformat()
                      }
                  )

              except Exception as error:

                  print(
                      "AI processing failed:",
                      error
                  )

                  final_news.append(
                      {
                          "title": article["title"],
                          "summary": article["description"],
                          "description": article["description"],
                          "category": translate_category(
                              ""
                          ),
                          "source": article["source"],
                          "link": article["link"],
                          "publishedAt": datetime.now(
                              timezone.utc
                          ).isoformat()
                      }
                  )

          output = {
              "updatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),

              "news": final_news
          }

          os.makedirs(".", exist_ok=True)

          with open(
              "news.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Successfully generated "
              f"{len(final_news)} Arabic news articles."
          )

          PY

          python generate_news.py

      - name: Check generated news
        run: |
          python -m json.tool news.json > /dev/null
          echo "news.json is valid."

      - name: Save news to repository
        run: |
          git config user.name "NOWNEX Bot"
          git config user.email "actions@github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No news changes."
          else
            git commit -m "Update NOWNEX Arabic news"
            git push
          fi
