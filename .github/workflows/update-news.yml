name: Update NOWNEX News

on:
  workflow_dispatch:

  schedule:
    # تحديث الأخبار كل 6 ساعات
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nownex-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # تحميل المشروع
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # إعداد Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # تثبيت المكتبات
      # ==========================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      # ==========================================
      # توليد أخبار NOWNEX
      # ==========================================
      - name: Generate Arabic news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          echo "=========================================="
          echo " NOWNEX NEWS UPDATE"
          echo "=========================================="

          python generate_news.py

      # ==========================================
      # التأكد من وجود news.json
      # ==========================================
      - name: Validate news.json
        run: |
          echo "Checking news.json..."

          if [ ! -f news.json ]; then
            echo "ERROR: news.json was not created."
            exit 1
          fi

          python - <<'PY'
          import json
          import sys

          with open(
              "news.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          news = data.get("news", [])

          print(
              f"NOWNEX articles: {len(news)}"
          )

          categories = [
              "AI",
              "Technology",
              "Cars",
              "Entertainment",
              "World",
              "Facts",
              "Products"
          ]

          for category in categories:

              count = sum(
                  1
                  for item in news
                  if item.get("category") == category
              )

              print(
                  f"{category}: {count}"
              )

          if not news:
              print("ERROR: No articles found.")
              sys.exit(1)

          print(
              "SUCCESS: news.json is valid."
          )

          PY

      # ==========================================
      # نشر الأخبار الجديدة على Facebook
      #
      # مهم:
      # هذه الخطوة تأتي قبل الحفظ والـ push
      # حتى يتم تحديث posted_news.json أولاً.
      # ==========================================
      - name: Publish latest news to Facebook
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: |
          echo "=========================================="
          echo " PUBLISHING NEW NOWNEX NEWS"
          echo "=========================================="

          python publish_to_facebook.py

      # ==========================================
      # التأكد من تحديث سجل الأخبار المنشورة
      # ==========================================
      - name: Validate posted_news.json
        run: |
          if [ ! -f posted_news.json ]; then
            echo "ERROR: posted_news.json was not created."
            exit 1
          fi

          python - <<'PY'
          import json

          with open(
              "posted_news.json",
              "r",
              encoding="utf-8"
          ) as f:
              posted = json.load(f)

          print(
              f"Published news stored: {len(posted)}"
          )

          PY

      # ==========================================
      # حفظ كل التغييرات
      #
      # هنا نحفظ:
      # 1. news.json
      # 2. posted_news.json
      #
      # حتى لا يتم نشر نفس الخبر مرة أخرى.
      # ==========================================
      - name: Save news and publication history
        run: |

          git config user.name "NOWNEX Bot"
          git config user.email "actions@github.com"

          git add news.json
          git add posted_news.json

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Update NOWNEX news and publication history"

            git push

          fi
