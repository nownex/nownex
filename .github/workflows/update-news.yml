name: Update NOWNEX News

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install feedparser

      - name: Update Arabic News with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > update_news.py <<'PY'
          import os
          import json
          import re
          import feedparser
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          API_KEY = os.environ["GEMINI_API_KEY"]

          MODEL = "gemini-2.5-flash-lite"

          FEEDS = [
              (
                  "BBC",
                  "World",
                  "https://feeds.bbci.co.uk/news/world/rss.xml"
              ),
              (
                  "BBC",
                  "Technology",
                  "https://feeds.bbci.co.uk/news/technology/rss.xml"
              ),
              (
                  "BBC",
                  "Science",
                  "https://feeds.bbci.co.uk/news/science_and_environment/rss.xml"
              ),
              (
                  "BBC",
                  "Entertainment",
                  "https://feeds.bbci.co.uk/news/entertainment_and_arts/rss.xml"
              )
          ]

          def clean(text):
              text = re.sub(r"<[^>]+>", " ", str(text or ""))
              text = re.sub(r"\s+", " ", text)
              return text.strip()

          def translate_with_gemini(title, description):

              prompt = f"""
أنت محرر الأخبار في منصة NOWNEX العربية.

حوّل الخبر التالي إلى محتوى إخباري عربي واضح واحترافي.

العنوان الأصلي:
{title}

الوصف الأصلي:
{description}

المطلوب:

- عنوان عربي احترافي.
- ملخص عربي من 2 إلى 4 فقرات قصيرة.
- لا تخترع أي معلومات.
- لا تضف أرقامًا أو تصريحات غير موجودة.
- استخدم العربية الفصحى السهلة.
- لا تستخدم Markdown.
- لا تذكر أنك ذكاء اصطناعي.

أعد النتيجة بهذا الشكل:

TITLE:
العنوان

SUMMARY:
الملخص
"""

              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/"
                  + MODEL
                  + ":generateContent?"
                  + urllib.parse.urlencode({"key": API_KEY})
              )

              body = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ]
              }

              request = urllib.request.Request(
                  url,
                  data=json.dumps(body).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      result = json.loads(
                          response.read().decode("utf-8")
                      )

                  text = result["candidates"][0]["content"]["parts"][0]["text"]

                  title_match = re.search(
                      r"TITLE:\s*(.*?)\s*SUMMARY:",
                      text,
                      re.S
                  )

                  summary_match = re.search(
                      r"SUMMARY:\s*(.*)",
                      text,
                      re.S
                  )

                  arabic_title = (
                      title_match.group(1).strip()
                      if title_match
                      else title
                  )

                  arabic_summary = (
                      summary_match.group(1).strip()
                      if summary_match
                      else description
                  )

                  return arabic_title, arabic_summary

              except Exception as error:

                  print("Gemini error:", error)

                  return title, description

          news = []
          seen = set()

          for source, category, feed_url in FEEDS:

              print("Loading:", source, category)

              feed = feedparser.parse(feed_url)

              for entry in feed.entries[:5]:

                  original_title = clean(
                      getattr(entry, "title", "")
                  )

                  description = clean(
                      getattr(entry, "summary", "")
                  )

                  link = getattr(
                      entry,
                      "link",
                      ""
                  )

                  if not original_title:
                      continue

                  key = original_title.lower()

                  if key in seen:
                      continue

                  seen.add(key)

                  arabic_title, arabic_summary = (
                      translate_with_gemini(
                          original_title,
                          description
                      )
                  )

                  news.append(
                      {
                          "id": len(news) + 1,
                          "title": arabic_title,
                          "summary": arabic_summary,
                          "originalTitle": original_title,
                          "source": source,
                          "category": category,
                          "link": link,
                          "updatedAt": datetime.now(
                              timezone.utc
                          ).isoformat()
                      }
                  )

                  if len(news) >= 12:
                      break

              if len(news) >= 12:
                  break

          output = {
              "site": "NOWNEX",
              "language": "ar",
              "updatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),
              "news": news
          }

          with open(
              "news.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "NOWNEX updated:",
              len(news),
              "articles"
          )
          PY

          python update_news.py

      - name: Commit news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          git diff --cached --quiet || git commit -m "Update NOWNEX Arabic news"

          git push
