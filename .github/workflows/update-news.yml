name: Update NOWNEX News

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nownex-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Generate Arabic news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          echo "=========================================="
          echo " GENERATING NOWNEX NEWS"
          echo "=========================================="

          python generate_news.py

      - name: Validate generated news.json
        run: |
          echo "=========================================="
          echo " VALIDATING NEWS.JSON"
          echo "=========================================="

          if [ ! -f news.json ]; then
            echo "ERROR: news.json was not created."
            exit 1
          fi

          python - <<'PY'
          import json
          import sys

          with open("news.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          news = data.get("news", [])

          print("updatedAt:", data.get("updatedAt"))
          print("Articles:", len(news))

          categories = [
              "AI",
              "Technology",
              "Cars",
              "Entertainment",
              "World",
              "Facts",
              "Products"
          ]

          for category in categories:
              count = sum(
                  1
                  for item in news
                  if item.get("category") == category
              )
              print(f"{category}: {count}")

          if not news:
              print("ERROR: No articles found.")
              sys.exit(1)

          PY

      - name: Publish latest news to Facebook
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: |
          echo "=========================================="
          echo " PUBLISHING NOWNEX NEWS TO FACEBOOK"
          echo "=========================================="

          python publish_to_facebook.py

      - name: Validate posted_news.json
        run: |
          echo "=========================================="
          echo " VALIDATING PUBLICATION HISTORY"
          echo "=========================================="

          if [ ! -f posted_news.json ]; then
            echo "ERROR: posted_news.json does not exist."
            exit 1
          fi

          python - <<'PY'
          import json

          with open("posted_news.json", "r", encoding="utf-8") as f:
              posted = json.load(f)

          print(
              f"Published news stored: {len(posted)}"
          )
          PY

      - name: Show files before commit
        run: |
          echo "=========================================="
          echo " FILES CHANGED"
          echo "=========================================="

          git status --short

          echo ""
          echo "news.json timestamp:"
          grep -m1 '"updatedAt"' news.json || true

      - name: Save news and publication history
        run: |
          echo "=========================================="
          echo " SAVING NOWNEX DATA"
          echo "=========================================="

          git config user.name "NOWNEX Bot"
          git config user.email "actions@github.com"

          git add news.json
          git add posted_news.json

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update NOWNEX news and publication history"
            git push origin main
          fi

      - name: Final status
        run: |
          echo "=========================================="
          echo " NOWNEX UPDATE FINISHED"
          echo "=========================================="

          git status --short
          git log -1 --oneline
